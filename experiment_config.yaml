# Sensory Perceiver Experiment Configuration
# Customize experiments without editing Python code
#
# Usage: python experiment_orchestrator.py --config experiment_config.yaml

orchestrator:
  n_gpus: 3
  monitor_interval: 30  # seconds between monitoring checks
  parallel: false       # Run one experiment per GPU in parallel
  push_to_github: false # Auto-commit results after completion

# Model hyperparameters (shared across experiments)
model:
  d_model: 768
  num_heads: 8
  depth: 6
  mlp_dim: 2048
  dropout: 0.1
  replay_buffer_size: 2000
  contrastive_temp: 0.07

# Training hyperparameters
training:
  batch_size: 32
  learning_rate: 0.0001
  warmup_steps: 1000
  num_workers: 4
  weight_decay: 0.01

# Device & reproducibility
execution:
  device: cuda:0  # Will be overridden by orchestrator
  seed: 42

# Benchmark configuration
benchmark:
  # Full benchmark: 3 datasets × 3 seeds each
  full:
    enabled: true
    datasets:
      - name: synthetic_iot
        code: iot
        epochs: 50
        seeds: [0, 1, 2]
        description: "Multimodal sensor streams (smartwatch, environmental, robot)"

      - name: split_cifar
        code: split_cifar
        epochs: 50
        seeds: [0, 1, 2]
        description: "Continual learning on Split-CIFAR-100 (20 tasks)"

      - name: permuted_mnist
        code: permuted_mnist
        epochs: 50
        seeds: [0, 1, 2]
        description: "Continual learning on Permuted MNIST (20 tasks)"

  # Quick benchmark: 1 dataset, 1 seed
  quick:
    enabled: true
    datasets:
      - name: synthetic_iot_quick
        code: iot
        epochs: 10
        seeds: [0]
        description: "Quick validation on synthetic IoT (10 epochs)"

  # Custom experiments (add your own)
  custom:
    enabled: false
    datasets:
      - name: custom_large_model
        code: split_cifar
        epochs: 100
        seeds: [0, 1, 2]
        hyperparameters:
          d_model: 1024
          num_heads: 16
          depth: 8
          batch_size: 24  # Reduced due to larger model
        description: "Large model variant for CIFAR"

# Output configuration
output:
  results_dir: results
  log_file: experiment_orchestrator.log
  dashboard_file: monitor_dashboard.html
  results_json: results/experiment_log.json
  summary_csv: results/summary.csv

# GitHub integration
github:
  enabled: false
  branch: main
  auto_commit: true
  commit_message: null  # Auto-generated if null
  include_files:
    - results/**
    - monitor_dashboard.html
    - experiment_orchestrator.log

# Notifications
notifications:
  enabled: false
  email:
    to: zachshallbetter@icloud.com
    on_completion: true
    on_failure: true
  slack:
    enabled: false
    webhook_url: null

# Performance monitoring
monitoring:
  track_gpu_memory: true
  track_cpu_usage: true
  track_latency: true
  dashboard_refresh_interval: 30  # seconds
  log_interval: 100  # batches

# Resource limits
resources:
  max_runtime_hours: 48  # Abort if exceeds this
  min_free_memory_gb: 4  # Warn if less than this available
  max_temperature_celsius: 85  # Warn if GPU hotter than this
